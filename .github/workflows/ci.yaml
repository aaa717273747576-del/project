name: CI/CD

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
        
      - name: Connect to VPS
        run: |
          export SSHPASS='Salam@123'

          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -p 22 \
            YOUR_USERNAME@YOUR_SERVER_IP \
            "whoami && hostname && uptime"
            
